name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle System
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release APK
        run: |
          gradle assembleRelease

      - name: Sign APK with apksigner
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$SIGNING_KEY_BASE64" | base64 -d > release.keystore
          UNSIGNED_APK=$(find . -name "*-release-unsigned.apk" | head -n 1)
          
          if [ -n "$UNSIGNED_APK" ]; then
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
              --ks release.keystore \
              --ks-pass pass:"$KEYSTORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass pass:"$KEY_PASSWORD" \
              --out ByteBeat-Release.apk \
              "$UNSIGNED_APK"
          else
            echo "File APK unsigned tidak ditemukan."
            exit 1
          fi

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ByteBeat-Release
          path: ByteBeat-Release.apk
          
