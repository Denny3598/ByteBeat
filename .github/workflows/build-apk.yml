name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: |
          if [ -f AppleMusicUI.zip ]; then unzip -q -o AppleMusicUI.zip; fi
          cd "$(dirname "$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)")"
          gradle assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/out/ByteBeat.apk"

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest out/ByteBeat.apk \
            --title 'ByteBeat Latest App' \
            --notes "Build otomatis dari commit ${GITHUB_SHA:0:7}" \
            --target "$GITHUB_SHA"
            
