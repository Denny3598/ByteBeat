name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

# Hanya satu build yang boleh menerbitkan release "latest" dalam satu waktu.
# Build yang lebih lama dibatalkan, supaya dua run tidak saling hapus dan buat release bersamaan.
concurrency:
  group: publish-latest
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Siapkan kunci tanda tangan
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/bytebeat.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/bytebeat.jks" >> "$GITHUB_ENV"

      - name: Build debug APK
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: gradle assembleDebug --no-daemon

      - name: Ganti nama APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ByteBeat.apk

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_SHA" > build-sha.txt
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest ByteBeat.apk build-sha.txt --title "ByteBeat (latest)" --notes "Build otomatis" --target "$GITHUB_SHA"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ByteBeat-debug
          path: ByteBeat.apk
